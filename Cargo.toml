[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/liveplayer-engine",
    "crates/liveplayer-db",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
